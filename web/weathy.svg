<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210" role="img" aria-label="Weathy, the ReadyNow! weather bot mascot, waving">
  <!-- antenna -->
  <line x1="100" y1="30" x2="100" y2="16" stroke="#24425C" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="12" r="7" fill="#F5B93F" stroke="#24425C" stroke-width="2.5" />

  <!-- feet -->
  <rect x="62" y="164" width="26" height="18" rx="9" fill="#24425C" />
  <rect x="112" y="164" width="26" height="18" rx="9" fill="#24425C" />

  <!-- left arm (down) -->
  <rect x="24" y="118" width="16" height="40" rx="8" fill="#7FBEE8" stroke="#24425C" stroke-width="3.5" />

  <!-- right arm (waving), outline pass then fill pass -->
  <path d="M164,120 C182,112 190,90 176,74" stroke="#24425C" stroke-width="19" stroke-linecap="round" fill="none" />
  <path d="M164,120 C182,112 190,90 176,74" stroke="#7FBEE8" stroke-width="14" stroke-linecap="round" fill="none" />
  <circle cx="176" cy="74" r="11" fill="#7FBEE8" stroke="#24425C" stroke-width="3.5" />

  <!-- wave motion lines -->
  <path d="M190,58 Q196,64 192,72" stroke="#24425C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55" />
  <path d="M198,70 Q204,76 200,84" stroke="#24425C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55" />

  <!-- ear bumps -->
  <circle cx="36" cy="95" r="11" fill="#7FBEE8" stroke="#24425C" stroke-width="3.5" />
  <circle cx="164" cy="95" r="11" fill="#7FBEE8" stroke="#24425C" stroke-width="3.5" />

  <!-- body -->
  <rect x="40" y="30" width="120" height="140" rx="46" fill="#7FBEE8" stroke="#24425C" stroke-width="4" />

  <!-- face panel -->
  <rect x="55" y="55" width="90" height="68" rx="28" fill="#EAF6FF" stroke="#24425C" stroke-width="3" />

  <!-- eyes -->
  <circle cx="80" cy="86" r="9" fill="#24425C" />
  <circle cx="120" cy="86" r="9" fill="#24425C" />
  <circle cx="83" cy="83" r="2.6" fill="#FFFFFF" />
  <circle cx="123" cy="83" r="2.6" fill="#FFFFFF" />

  <!-- smile -->
  <path d="M82,104 Q100,116 118,104" stroke="#24425C" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- chest badge: sun peeking behind cloud -->
  <circle cx="100" cy="150" r="23" fill="#FFFFFF" stroke="#24425C" stroke-width="3.5" />
  <circle cx="91" cy="142" r="7" fill="#F5B93F" />
  <line x1="91" y1="134" x2="91" y2="126" stroke="#F5B93F" stroke-width="2.5" stroke-linecap="round" />
  <line x1="86" y1="137" x2="79" y2="130" stroke="#F5B93F" stroke-width="2.5" stroke-linecap="round" />
  <line x1="84" y1="147" x2="76" y2="151" stroke="#F5B93F" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="104" cy="155" rx="15" ry="8.5" fill="#FFFFFF" stroke="#24425C" stroke-width="1.8" />
  <circle cx="95" cy="150" r="7.5" fill="#FFFFFF" stroke="#24425C" stroke-width="1.8" />
  <circle cx="106" cy="147" r="8.5" fill="#FFFFFF" stroke="#24425C" stroke-width="1.8" />
  <circle cx="115" cy="151" r="6.5" fill="#FFFFFF" stroke="#24425C" stroke-width="1.8" />
</svg>
